[package]
name = "logscroll"
version = "1.0.0"
edition = "2024"
authors = ["thscharler <thscharler@gmail.com>"]
description = "watch the logs scroll by"
license = "MIT/Apache-2.0"
repository = "https://github.com/thscharler/logscroll"
readme = "readme.md"
keywords = ["log-file", "tui"]
categories = ["command-line-interface"]
exclude = [".idea/*", ".gitignore"]

[features]
default = []
wgpu = ["rat-salsa-switch/wgpu"]
term = ["rat-salsa-switch/term"]

[dependencies]
log = "0.4"
crossbeam = "0.8"
anyhow = "1.0"
configparser = { version = "3.1", features = ["indexmap"] }
dirs = "7.0"
fern = "0.7"
regex-cursor = "0.1.5"
ropey = "1.6.1"
unicode-segmentation = "1.11"

ratatui = "0.30.0"
crossterm = { version = "0.29.0" }

rat-salsa-switch = { version = "0.1", path = "../rat-salsa-switch", features = [] }
rat-widget = { version = "3.0", features = ["user_directories", "cli-clipboard"] }
rat-theme4 = { version = "4.5" }


[[bin]]
name = "logsw"
path = "src/main.rs"
required-features = ["wgpu"]

[[bin]]
name = "logs"
path = "src/main.rs"
required-features = ["term"]